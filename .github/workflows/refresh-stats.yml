name: Refresh GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats card
        run: >
          curl -sf
          "https://github-readme-stats.vercel.app/api?username=rajatoutbox&show_icons=true&hide_border=true&bg_color=0b1220&title_color=38bdf8&icon_color=38bdf8&text_color=cbd5e1"
          -o assets/stats.svg

      - name: Fetch streak card
        run: >
          curl -sf
          "https://streak-stats.demolab.com/?user=rajatoutbox&hide_border=true&background=0b1220&ring=38bdf8&fire=38bdf8&currStreakLabel=38bdf8&sideLabels=cbd5e1&currStreakNum=e2e8f0&sideNums=e2e8f0&dates=64748b"
          -o assets/streak.svg

      - name: Fetch top languages card
        run: >
          curl -sf
          "https://github-readme-stats.vercel.app/api/top-langs/?username=rajatoutbox&layout=compact&hide_border=true&bg_color=0b1220&title_color=38bdf8&text_color=cbd5e1"
          -o assets/top-langs.svg

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/streak.svg assets/top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh GitHub stats" && git push)
