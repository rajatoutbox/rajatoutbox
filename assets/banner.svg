<svg width="960" height="230" viewBox="0 0 960 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="230" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="57" x2="960" y2="57"/>
    <line x1="0" y1="114" x2="960" y2="114"/>
    <line x1="0" y1="171" x2="960" y2="171"/>
    <line x1="192" y1="0" x2="192" y2="230"/>
    <line x1="384" y1="0" x2="384" y2="230"/>
    <line x1="576" y1="0" x2="576" y2="230"/>
    <line x1="768" y1="0" x2="768" y2="230"/>
  </g>

  <!-- abstract network graph, right side -->
  <g stroke="#38bdf8" stroke-width="1.4" opacity="0.55">
    <line x1="700" y1="70" x2="770" y2="45"/>
    <line x1="700" y1="70" x2="760" y2="115"/>
    <line x1="700" y1="70" x2="820" y2="80"/>
    <line x1="760" y1="115" x2="820" y2="80"/>
    <line x1="760" y1="115" x2="800" y2="165"/>
    <line x1="820" y1="80" x2="890" y2="60"/>
    <line x1="820" y1="80" x2="880" y2="130"/>
    <line x1="800" y1="165" x2="880" y2="130"/>
    <line x1="880" y1="130" x2="915" y2="175"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="700" cy="70" r="4.5"/>
    <circle cx="770" cy="45" r="3.5" opacity="0.8"/>
    <circle cx="760" cy="115" r="5.5"/>
    <circle cx="820" cy="80" r="4.5"/>
    <circle cx="800" cy="165" r="3.5" opacity="0.8"/>
    <circle cx="890" cy="60" r="3.5" opacity="0.8"/>
    <circle cx="880" cy="130" r="5.5"/>
    <circle cx="915" cy="175" r="3.5" opacity="0.8"/>
  </g>

  <!-- accent tab -->
  <rect x="0" y="0" width="6" height="230" fill="#38bdf8"/>

  <!-- text block -->
  <text x="56" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">RAJAT KUMAR SINGH</text>
  <text x="56" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#38bdf8">Network Engineer  →  Platform &amp; Infrastructure Engineering</text>

  <line x1="56" y1="140" x2="456" y2="140" stroke="url(#accentLine)" stroke-width="2"/>

  <text x="56" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">HCL Technologies  ·  Lucknow, India</text>
  <text x="56" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Building self-hosted private cloud infrastructure on Proxmox, Terraform &amp; Ansible</text>
</svg>
