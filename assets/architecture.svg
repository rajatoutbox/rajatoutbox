<svg width="920" height="480" viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .node { fill:#111a2e; stroke:#1e293b; stroke-width:1.4; }
      .node-accent { fill:#0f2436; stroke:#38bdf8; stroke-width:1.4; }
      .lbl { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#e2e8f0; }
      .lbl-sub { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#94a3b8; }
      .lbl-accent { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill:#38bdf8; font-weight:600; }
      .edge { stroke:#334155; stroke-width:1.4; fill:none; }
    </style>
  </defs>

  <rect width="920" height="480" fill="#0b1220"/>
  <text x="30" y="38" class="lbl-accent" font-size="16">Focus Areas</text>
  <text x="30" y="58" class="lbl-sub" font-size="12">How network engineering and platform engineering skills connect</text>

  <!-- root node -->
  <rect x="380" y="85" width="160" height="46" rx="6" class="node-accent"/>
  <text x="460" y="113" text-anchor="middle" class="lbl" font-size="14" font-weight="600">Rajat</text>

  <!-- branch edges -->
  <path class="edge" d="M460,131 L460,150 L215,150 L215,175"/>
  <path class="edge" d="M460,131 L460,150 L705,150 L705,175"/>

  <!-- left branch: Networking -->
  <rect x="120" y="175" width="190" height="42" rx="6" class="node"/>
  <text x="215" y="201" text-anchor="middle" class="lbl" font-size="13" font-weight="600">Network Engineering</text>

  <path class="edge" d="M215,217 L215,235 L100,235 L100,255"/>
  <path class="edge" d="M215,217 L215,235 L330,235 L330,255"/>

  <rect x="30" y="255" width="140" height="38" rx="6" class="node"/>
  <text x="100" y="279" text-anchor="middle" class="lbl-sub" font-size="12">CCNA · Routing &amp; Switching</text>

  <rect x="260" y="255" width="140" height="38" rx="6" class="node"/>
  <text x="330" y="279" text-anchor="middle" class="lbl-sub" font-size="12">Cisco Packet Tracer</text>

  <!-- right branch: Platform Engineering -->
  <rect x="610" y="175" width="190" height="42" rx="6" class="node"/>
  <text x="705" y="201" text-anchor="middle" class="lbl" font-size="13" font-weight="600">Cloud &amp; Platform Engineering</text>

  <path class="edge" d="M705,217 L705,235 L560,235 L560,255"/>
  <path class="edge" d="M705,217 L705,235 L705,255"/>
  <path class="edge" d="M705,217 L705,235 L850,235 L850,255"/>

  <rect x="490" y="255" width="140" height="38" rx="6" class="node"/>
  <text x="560" y="279" text-anchor="middle" class="lbl-sub" font-size="12">Terraform · Ansible</text>

  <rect x="635" y="255" width="140" height="38" rx="6" class="node"/>
  <text x="705" y="279" text-anchor="middle" class="lbl-sub" font-size="12">Proxmox VE · Cloud-Init</text>

  <rect x="780" y="255" width="140" height="38" rx="6" class="node"/>
  <text x="850" y="279" text-anchor="middle" class="lbl-sub" font-size="12">Docker · Swarm · Jenkins</text>

  <!-- convergence to observability -->
  <path class="edge" d="M330,293 L330,320 L460,320 L460,340"/>
  <path class="edge" d="M100,293 L100,320 L460,320"/>
  <path class="edge" d="M560,293 L560,320 L460,320"/>
  <path class="edge" d="M705,293 L705,320 L460,320"/>
  <path class="edge" d="M850,293 L850,320 L460,320"/>

  <rect x="330" y="340" width="260" height="42" rx="6" class="node"/>
  <text x="460" y="366" text-anchor="middle" class="lbl" font-size="13" font-weight="600">Monitoring — Prometheus · Grafana</text>

  <path class="edge" d="M460,382 L460,405"/>

  <!-- output project -->
  <rect x="290" y="405" width="340" height="46" rx="6" class="node-accent"/>
  <text x="460" y="433" text-anchor="middle" class="lbl-accent" font-size="14">atlas-private-cloud-platform</text>
</svg>
